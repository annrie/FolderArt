name: FolderArt
options:
  bundleIdPrefix: com.example
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
targets:
  FolderArt:
    type: application
    platform: macOS
    sources:
      - path: FolderArt
        excludes:
          - ".claude"
          - ".claude/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FolderArt
        MARKETING_VERSION: 1.3.0
        CURRENT_PROJECT_VERSION: 6
        SWIFT_VERSION: 5.9
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: FolderArt/Info.plist
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    entitlements:
      path: FolderArt/FolderArt.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: FolderArt/Info.plist
      properties:
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleName: FolderArt
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        CFBundleDocumentTypes:
          - CFBundleTypeName: FolderArt Preset Pack
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.example.folderart.pack]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.example.folderart.pack
            UTTypeDescription: FolderArt Preset Pack
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [folderartpack]
  FolderArtTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FolderArtTests
    dependencies:
      - target: FolderArt
    settings:
      base:
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
